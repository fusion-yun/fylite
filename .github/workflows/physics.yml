# 物理校验批 —— 判据册（`fylite.scenario.physics`）与批次（`scenario.suite` +
# `tools/benchmark-run.py`）改了就跑，外加**真跑一条**。
#
# ★★为什么要单独一档而不是并进 Python 档：这一档要**构建数据层**（`libfylite_runtime.so`，
#   连着两个 C 库），才跑得动「判一份盘上的产出」那条路——本仓自带的合成 g-file
#   由此被真的量一次（Grad–Shafranov 残差、ψ 端点、边界闭合）。Python 档不该为了
#   一条判据背上一次 Rust 构建。
# ★`--strict`：一条也没评上就以非零码退出。没有它，「批次悄悄空了」会显示成
#   「零个失败」——那正是这一档最该拦住的一种绿。
name: physics-checks

# ★★**已暂停自动触发（2026-09-03，用户裁定）。** 原先按路径在 push / pull_request 上跑，
#   现在两个自动入口都撤了，只留 `workflow_dispatch`（手动）与 `workflow_call`（被 full
#   调用）。**这一档本身没有变**——步骤、判据、`--strict` 全在原处，随时手动可跑：
#
#       gh workflow run physics-checks --ref <branch>
#
#   ★ 另一条自动入口在 `full.yml` 的 `physics` job（每周一定时），已同批改为仅手动全量
#     时成立；恢复自动触发时那边要一并改回，只改这里会漏。
#   ★ 恢复：把下面注释掉的 push / pull_request 两节放回即可，路径清单原样留着。
on:
  workflow_dispatch:
  workflow_call:

  # —— 暂停中，恢复时取消注释 ——
  # push:
  #   branches: [develop, main, "claude/**"]
  #   paths:
  #     - "benchmark/physics/**"
  #     - "python/fylite/scenario/physics.py"
  #     - "python/fylite/scenario/suite.py"
  #     - "python/tests/test_physics_checks.py"
  #     - "python/tests/test_physics_suite.py"
  #     - "tools/benchmark-run.py"
  #     - "rust/fylite_runtime/**"
  #     - ".github/workflows/physics.yml"
  # pull_request:
  #   branches: [develop, main]
  #   paths:
  #     - "benchmark/physics/**"
  #     - "python/fylite/scenario/physics.py"
  #     - "python/fylite/scenario/suite.py"
  #     - "python/tests/test_physics_checks.py"
  #     - "python/tests/test_physics_suite.py"
  #     - "tools/benchmark-run.py"
  #     - "rust/fylite_runtime/**"
  #     - ".github/workflows/physics.yml"

concurrency:
  group: physics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: C 库（libhdf5 · libnetcdf）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libhdf5-dev libnetcdf-dev

      - name: cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/fylite_runtime/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/fylite_runtime/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: python -m pip install --upgrade pip && pip install numpy pyyaml pytest

      - name: 构建数据层（判「盘上的产出」那条路要它）
        run: ./rust/build.sh --exe

      - name: 判据册与批次的闸子
        working-directory: python
        run: python -m pytest -q -p no:cacheprovider tests/test_physics_checks.py tests/test_physics_suite.py

      - name: 册子的结构检查
        working-directory: python
        run: python -m fylite cases --physics --check

      - name: 真跑一条（本仓自带的合成 g-file）
        run: python tools/benchmark-run.py --only equilibrium-gfile --strict

      - name: 整批（内核不在场的条目记为「未评估」并写明理由）
        run: python tools/benchmark-run.py
