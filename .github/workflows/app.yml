# 站点的静态门 —— 只跑在**干净检出里真的能判**的那几道。
#
# ★★`app/tests/` 有 45 道门，这里只跑 6 道，这不是抽样而是**能力边界**：其余
#   31 道要 Playwright 打开页面、另几道要读构建产物（`app/assets/*.wasm`、渲染出的
#   guide、装置牌），而那些制品由**私有内核仓**构建、或来自私有语料。把跑不了的
#   标成绿，比不跑更坏——所以它们留给带得到制品的环境（README「两个仓库」）。
# ★这 6 道是 2026-09-02 在一份干净检出里逐个实测出来的：site / typography 读的是
#   仓里的文件；device / east-catalog / app-mdsip / jmds 在私有夹具不在场时**自己
#   跳过**（它们的 README 写明了那条政策），不退回假服务器。
name: app

on:
  push:
    branches: [develop, main, "claude/**"]
    paths:
      - "app/**"
      - "tools/make-app-pages.mjs"
      - "tools/make-app-embed.mjs"
      - "tools/app-pages/**"
      - ".github/workflows/app.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "app/**"
      - "tools/make-app-pages.mjs"
      - "tools/make-app-embed.mjs"
      - "tools/app-pages/**"
      - ".github/workflows/app.yml"
  workflow_call:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 站点形状与排版
        run: |
          node app/tests/validate-site.mjs
          node app/tests/validate-typography.mjs
      - name: 装置文档与 mdsip 回放（夹具不在场时自跳）
        run: |
          node app/tests/validate-device.mjs
          node app/tests/validate-east-catalog.mjs
          node app/tests/validate-app-mdsip.mjs
          node app/tests/validate-jmds.mjs
