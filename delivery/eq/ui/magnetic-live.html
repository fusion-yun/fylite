</style></head><body><header class="top"><strong>FYLite · 平衡分析</strong><span>真实数据与原生计算</span><a href="../workflow.html">固定压力工作台</a></header><div class="shell"><aside class="tree" aria-label="算例库"><div class="tree-title"><b>算例库</b><span id="tree-count"></span><button id="tree-new" class="tree-new" type="button">＋ 新建算例</button></div><div class="tree-filter"><input id="tree-search" type="search" placeholder="搜索算例 / 炮号 / 掩码" aria-label="搜索算例"><select id="tree-status" aria-label="筛选状态"><option value="">全部状态</option><option value="waiting_review">待审阅</option><option value="reviewed">已审阅</option><option value="running">运行中</option><option value="failed">失败</option></select></div><div id="tree-body"><p class="tree-hint">正在读取算例…</p></div></aside><main class="detail wrap"><div id="start-view"><div class="intro"><span class="eyebrow">EQUILIBRIUM ANALYSIS</span><h1>先确定分析对象与计算场景</h1><p>按装置、炮号和时刻建立实验反演；正向计算使用给定边界与源项，不读取实验炮号。场景决定后续可用的规则和计算入口。</p></div><section class="setup surface"><h2>建立分析对象</h2><p class="lead">先选计算场景，再核对该场景的输入规则和当前可运行范围。</p><div class="query"><label>装置<select id="device"><option value="EAST">EAST · 实验装置</option><option value="analytic">解析示范 · 无实验装置</option></select></label><label>炮号<input id="shot" type="number" min="1" step="1" value="164437"></label><label>目标时刻 / s<input id="time" type="number" min="0" step="0.001" value="6.386"></label><label>计算场景<select id="scenario"><optgroup label="平衡反演"><option value="magnetic">单次反演</option><option value="geometry">诊断重映射</option><option value="physics">源项重算</option></optgroup><optgroup label="平衡正向计算"><option value="fixed">固定边界正解 · 合成示范</option></optgroup></select></label></div><div id="scene-panel" class="scene-panel"><h3 id="scene-title"></h3><p id="scene-description"></p><div id="scene-options" class="scene-options"></div><div id="scene-controls" class="scene-controls"><label>压力来源<select id="pressure-source"><option value="unconstrained">无（仅磁测）</option><option value="imported_total">外部导入</option><option value="diagnostic_thermal">诊断合成</option><option value="thermal_plus_fast">诊断合成 + 快离子</option></select></label><label id="pressure-constraint-wrap" hidden>压力作用方式<select id="pressure-constraint"><option value="soft">软约束</option><option value="fixed_shape_scaled">固定形状、拟合倍率</option><option value="fixed_values">固定数值</option></select></label><label id="current-source-wrap" hidden>电流模型<select id="current-source"><option value="free_pprime_ffprime">自由 p′ / FF′</option><option value="bootstrap_plus_residual">自举＋剩余电流</option></select></label></div><div id="update-controls" class="scene-options" hidden></div><div id="magnetic-rules"><label>磁通道规则与权重<select id="mask"><option value="m02_pinned">164437 历史 M02：计划纳入 79 道固定权重</option><option value="device_default">装置默认规则：探索性分析</option></select></label><p class="hint">先确定拟提交的通道；实际参与拟合的通道数以求解结果为准。</p></div><div id="fixed-rules" hidden><label>正解网格<select id="grid"><option value="33">33 × 33</option><option value="65" selected>65 × 65</option><option value="129">129 × 129</option></select></label><p class="hint">给定解析边界与源项，q₀ 是输出；炮号和实验时刻不适用。</p></div><p id="scene-plan" class="read-only"></p><div class="scene-actions"><button id="create" class="primary">建立纯磁分析</button><button id="download-draft" class="secondary" hidden>下载配置草稿</button><span id="scene-availability" class="scene-status"></span></div></div><div id="start-error" class="error-message"></div><div class="matches"><h3>继续个人分析</h3><div id="recent">正在读取记录…</div></div></section></div><div id="workspace" class="workspace"><div class="taskbar"><button id="back-start">← 新建或选择分析</button><strong id="case-title"></strong><small id="case-kind"></small><span id="case-badge" class="pill"></span><div class="case-tabs" role="tablist"><button id="tab-process" class="tabbtn active" role="tab">过程</button><button id="tab-result" class="tabbtn" role="tab" disabled>结果</button></div></div><nav class="progress" id="progress" aria-label="分析阶段"></nav><section class="stage surface"><span id="stage-index" class="stage-index"></span><h2 id="stage-title"></h2><p id="stage-lead" class="lead"></p><div id="stage-body"></div><div class="footer-actions"><button id="prev" class="secondary">上一步</button><button id="next" class="primary">下一阶段</button><span id="footer-status" class="hint"></span></div></section><section id="result-view" class="result-view" hidden><div class="result-shell"><aside id="dd-tree" class="dd-tree" aria-label="DD 数据树"></aside><div id="result-body"></div></div></section></div></main></div><script src="assets/eq-plots.js?v=1" defer></script><script src="assets/magnetic-live.js?v=eqp1" defer></script></body></html>
