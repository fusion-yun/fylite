; Test configuration for the Python package.
;
; ★★2026-09-02：本文件与 `conftest.py` 从**仓根**下移到 `python/`。
; 它们当初上去是因为有**两档**测试（2026-08-22）：`python/tests` 是 Python 档
; （装配 / IO / 协议·CLI 面 / 注册表 / ABI 编组），仓根 `tests/` 是物理数值档
; （oracle 对拍与一切关于计算出来的物理量的断言）。一份 conftest 服务两棵树，
; 而 conftest 只对**自己目录以下**生效 ⇒ 它必须待在两棵树的共同祖先，也就是仓根。
;
; ★那个理由已经消失：物理数值档连同它的 `oracles/` 已收敛进 fylite_kernel
; （见该仓 `tests/PHYSICS-MIGRATION.md`），本仓只剩 `python/tests` 一档，而它的
; 共同祖先就是 `python/`。配置留在仓根，就是让一个**只服务 python/ 的**工程文件
; 把整个仓当作自己的 rootdir——顺带把 `benchmark/` `docs/` `app/` 也收进默认收集面。
;
; ★★**怎么调用，取决于 pytest 怎么找到本文件**。pytest 从参数（无参数时从 cwd）
; **向上**走找 ini，从不往下看。所以：
;
;     cd python && pytest        ← 本档（rootdir = python/）
;     pytest python/tests        ← 同上：从参数向上第一站就找到 python/pytest.ini
;     pytest                     ← ★在**仓根**裸跑找不到任何 ini，rootdir 退回仓根、
;                                  `testpaths` 无从生效，于是按 cwd 全树收集，
;                                  `pythonpath` 也不再加——**那不是本档**。
;
; ★下面两条路径都按 **rootdir（= `python/`）** 解析，不是按仓根。
[pytest]
; 包在 rootdir 自己这一层（`python/fylite/`），所以是 `.` 而不是 `python`。
pythonpath = .
; 唯一的一档。物理数值档不在本仓，`-m "not physics"` 那套暂停口径随之退休。
testpaths = tests
; `slow` marks a test that drives real Grad-Shafranov solves (seconds, not
; milliseconds).  Registered rather than left implicit so `-m "not slow"` is
; an available choice and an unknown-mark warning cannot hide a typo.
markers =
    slow: drives full equilibrium solves (seconds per test)
    physics: a PHYSICS/NUMERICS claim — those live in fylite_kernel now;
        a module carrying this mark HERE is the boundary coming back
        (see tests/test_tiers_are_separate.py)
