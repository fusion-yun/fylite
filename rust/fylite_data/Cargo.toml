# fylite 的**数据层** —— 取数与格式，不做物理。
#
# ★★2026-09-02 裁定：内核库只算数，数据平面归这里（评估见对话记录；判据是
# `fylite_kernel` 的 `fyo.rs:220`「the one document the KERNEL never reads」与
# FYL-SDD-01 DE-COMP-02——在算数的那层做宿主的活是错的分层）。
#
# ★**源码公开**，与内核相反：这里是协议编解码与文件格式，不是物理 IP。
# 一份源，三个制品：
#
#   libfylite_data.so   Python 直接 load（取代 `python/fylite/io/mds.py` 那 480 行）
#   fylite-app          单文件桌面查看器：内嵌整个 `app/` + mdsip 请求面
#   fylite_data.wasm    浏览器用 —— ★**不含 mdsip**（用户裁定 2026-09-02：
#                       纯浏览器端不包含 mdsip 支持；浏览器本就打不开裸 TCP，
#                       FYL-DESIGN-06 §1 早已关死那条）
[package]
name = "fylite_data"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "fylite data plane — MDSplus mdsip codec and file-format readers"

[lib]
name = "fylite_data"
crate-type = ["cdylib", "rlib"]

[features]
# `mdsip` 是**原生专用**：wasm 没有 socket，浏览器也不该有这条路。
# 默认开（`.so` 与可执行文件要它）；wasm 构建用 --no-default-features 去掉。
#
# ★★`hdf5` 与 `netcdf` 同样是原生专用，理由不同：它们是**两个 C 库**（libhdf5、
# libnetcdf）——本 crate 至今的依赖表是空的，而 HDF5 的文件格式（B 树、分块、过滤器、
# 外部链接）与 netCDF-4 的方言（维度标尺、`_NCProperties`）自己写一份能读 imas-python
# 写的文件、也能被它读回的实现，是一个季度的活，而且是一份第三实现。与 IMAS 那两种
# 布局逐字兼容才是目标，所以链真的库。`static` 把它们一起从源码编进 `.so`
# （发行给没装库的机器）；缺省动态链接系统库（`apt install libhdf5-dev libnetcdf-dev`）。
# wasm 构建 `--no-default-features`：那边只有 g-file 与 JSON 两种格式。
default = ["mdsip", "hdf5", "netcdf"]
mdsip = []
hdf5 = ["dep:hdf5"]
netcdf = ["dep:netcdf", "hdf5"]
#: ★`hdf5/zlib` rides along: the IMAS HDF5 backend layout writes every chunked
#: dataset with the deflate filter (as imas-core does), and a from-source HDF5
#: without zlib refuses it at the first dataset («Filter not available: Deflate»,
#: measured 2026-09-02).  A dynamically linked system libhdf5 has it built in.
static = ["hdf5/static", "hdf5/zlib", "netcdf/static"]
#: 桌面查看器。`required-features` 让它不进默认构建——`cargo build` 与
#: `cargo test` 的产物因此不受它影响。
desktop = ["mdsip"]

[[bin]]
name = "fylite-app"
path = "src/bin/app/main.rs"
required-features = ["desktop"]

#: 数据层的命令行：看一眼文件是什么、格式互转、合并、按 JSON-LD 装配多个数据源。
#: 原生专用（要读盘）；wasm 构建里没有它。
[[bin]]
name = "fylite-data"
path = "src/bin/data/main.rs"
required-features = ["mdsip"]

#: 算例的命令行：一份 fyo 计划进、一份 fyo 记录出，经内核（运行期 dlopen
#: `libfylite_kernel.so`）。原生专用；不要求任何特性——JSON 计划与 JSON-LD 记录
#: 零依赖，HDF5 / netCDF 产出只在带那两个特性时可选。
[[bin]]
name = "fylite-case"
path = "src/bin/case/main.rs"

[dependencies]
#: ★两个都是可选的、都只在原生目标上有意义（见 `[features]`）。版本钉到次版本：
#: 它们的 API 在 0.x 之间会动，而这里对它们的调用面很窄。
hdf5 = { package = "hdf5-metno", version = "0.14", optional = true }
netcdf = { version = "0.12", optional = true }

[profile.release]
opt-level = 3
lto = true
panic = "unwind"
#: ★与内核同一条理由：制品是发行物，未 strip 的二进制附送一份内部结构地图。
#: 这里的源码是公开的，所以理由只剩体积——但两个制品的构建规矩保持一致，
#: 不让「哪个制品该 strip」变成要逐个记住的事。
strip = "symbols"
