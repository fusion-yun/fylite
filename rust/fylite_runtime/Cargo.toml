# fylite 的**数据层** —— 取数与格式，不做物理。
#
# ★★2026-09-02 裁定：内核库只算数，数据平面归这里（评估见对话记录；判据是
# `fylite_kernel` 的 `fyo.rs:220`「the one document the KERNEL never reads」与
# FYL-SDD-01 DE-COMP-02——在算数的那层做宿主的活是错的分层）。
#
# ★**源码公开**，与内核相反：这里是协议编解码与文件格式，不是物理 IP。
# 一份源，三个制品：
#
#   libfylite_runtime.so   Python 直接 load（取代 `python/fylite/io/mds.py` 那 480 行）
#   fylite          **唯一的可执行文件**：内嵌整个 `app/` + mdsip 请求面，
#                       并承载全部命令词（`app` / `data` / `case`；无子命令时
#                       跑 `app`，所以双击仍然可用）
#   fylite_runtime.wasm    浏览器用 —— ★**不含 mdsip**（用户裁定 2026-09-02：
#                       纯浏览器端不包含 mdsip 支持；浏览器本就打不开裸 TCP，
#                       FYL-DESIGN-06 §1 早已关死那条）
[package]
name = "fylite_runtime"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "fylite data plane — MDSplus mdsip codec and file-format readers"

[lib]
name = "fylite_runtime"
crate-type = ["cdylib", "rlib"]

[features]
# `mdsip` 是**原生专用**：wasm 没有 socket，浏览器也不该有这条路。
# 默认开（`.so` 与可执行文件要它）；wasm 构建用 --no-default-features 去掉。
#
# ★★`hdf5` 与 `netcdf` 同样是原生专用，理由不同：它们是**两个 C 库**（libhdf5、
# libnetcdf）——本 crate 至今的依赖表是空的，而 HDF5 的文件格式（B 树、分块、过滤器、
# 外部链接）与 netCDF-4 的方言（维度标尺、`_NCProperties`）自己写一份能读 imas-python
# 写的文件、也能被它读回的实现，是一个季度的活，而且是一份第三实现。与 IMAS 那两种
# 布局逐字兼容才是目标，所以链真的库。`static` 把它们一起从源码编进 `.so`
# （发行给没装库的机器）；缺省动态链接系统库（`apt install libhdf5-dev libnetcdf-dev`）。
# wasm 构建 `--no-default-features`：那边只有 g-file 与 JSON 两种格式。
default = ["mdsip", "hdf5", "netcdf"]
mdsip = []
hdf5 = ["dep:hdf5"]
netcdf = ["dep:netcdf", "hdf5"]
#: ★`hdf5/zlib` rides along: the IMAS HDF5 backend layout writes every chunked
#: dataset with the deflate filter (as imas-core does), and a from-source HDF5
#: without zlib refuses it at the first dataset («Filter not available: Deflate»,
#: measured 2026-09-02).  A dynamically linked system libhdf5 has it built in.
static = ["hdf5/static", "hdf5/zlib", "netcdf/static"]
#: 桌面查看器。`required-features` 让它不进默认构建——`cargo build` 与
#: `cargo test` 的产物因此不受它影响。
#: ★★2026-09-04 用户裁定：`fylite` 有**三种构建方式**，差别在带不带浏览器那一半。
#:   纯 CLI  —— 不带 `webui`：可执行文件里没有内嵌的 `app/`、没有 HTTP 服务，
#:              `app` 命令按名拒绝。`data` / `case` 照常（`case` 运行期 dlopen
#:              原生内核 `.so`——「仅包含 .so」说的就是这一档）。
#:   Web UI  —— 带 `webui`：内嵌整个 `app/`（含三个 `.wasm`），起回环服务、开浏览器。
#:   完整    —— `desktop`：`webui` + `mdsip`，两路都在。
#: 分档不是为了省字节而已：一个不带浏览器前端的发行**不该**把 app 的字节背在身上，
#: 而带不带，读者应当能从 `--help` 上看出来，而不是运行到一半才发现。
#: 这个 bin 的最小档：只要命令行本身。三种方式都含它。
cli = []
#: ★`webui` 含 `mdsip`：内嵌前端与它的只读请求面（`/api/*`）是同一半——页面上的
#: 装置数据面板就是经那组端点取数的，去掉 mdsip 那个模块就编不出来。想要「有网页
#: 但不许连 MDSplus」不是构建期的事，是运行期不给 `--mdsip`（那时 `/api/health`
#: 照答，只是说自己没有数据源——`FYL-DESIGN-13` P-10）。
webui = ["cli", "mdsip"]
desktop = ["webui", "mdsip", "cli"]

#: ★★2026-09-03：**一个可执行文件**（用户裁定）。此前这里有三个 `[[bin]]`——
#: `fylite` 加上 `fylite-data` / `fylite-case` 两个十行的薄壳，后两者只做一件事：
#: 把 `data` / `case` 前置到 argv，再调用同一份 `cli::parse` 与 `cli::data::run` /
#: `cli::case::run`。那一份前置现在由**调用方**给：Python 宿主委托时前置命令词
#: （`engine/cli.py` 的 `_RUST_EXES`），人在命令行上则直接 `fylite data …`。
#: 少两个二进制、少两条 `_bin/` 项、少一处「用法里 `fylite-data data` 折回
#: `fylite-data`」的字符串替换——而能力一条没少。
#: ★★2026-09-04 名字是 `fy`（用户裁定）。它此前叫 `fylite-app`，然后叫 `fylite`——
#: 而 `fylite` 正是 Python 包装的控制台脚本的名字，同名逼出了 `engine/cli.py` 里
#: 一段「找到的这个 `fylite` 是不是我自己」的读文件判据（不判就是无限 fork）。
#: 两个名字不同之后，那个失败方式在**源头**上没有了。
[[bin]]
name = "fy"
path = "src/bin/app/main.rs"
#: ★★2026-09-04 由 `desktop` 放宽到 `cli`：三种构建方式都出这一个可执行文件，
#: 差别在带不带 `webui`（内嵌前端 + HTTP 服务）与 `mdsip`。钉死 `desktop` 就
#: 只剩「完整」一档，纯 CLI 那一档根本编不出来。
#: `cli` 本身不带任何东西——它在这里的作用是「这个 bin 是有意要构建的」，
#: 而不是 `cargo build` 顺手把它编出来（那正是 `required-features` 当初要防的）。
required-features = ["cli"]

[dependencies]
#: ★两个都是可选的、都只在原生目标上有意义（见 `[features]`）。版本钉到次版本：
#: 它们的 API 在 0.x 之间会动，而这里对它们的调用面很窄。
hdf5 = { package = "hdf5-metno", version = "0.14", optional = true }
netcdf = { version = "0.12", optional = true }

[profile.release]
opt-level = 3
lto = true
panic = "unwind"
#: ★与内核同一条理由：制品是发行物，未 strip 的二进制附送一份内部结构地图。
#: 这里的源码是公开的，所以理由只剩体积——但两个制品的构建规矩保持一致，
#: 不让「哪个制品该 strip」变成要逐个记住的事。
strip = "symbols"
