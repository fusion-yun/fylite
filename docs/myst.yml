# fylite 文档 —— **一本书**。
#
# ★★**为什么是一本书而不是书集。** 用 `site.projects` 挂几本各自带 `myst.yml` 的书，
# 有一处躲不开的代价：MyST 1.10.1 在多 project 站点下**不构建根 project**，于是站点根上
# 没有页面，`/` 只能 302 到列表里的第一本——「哪本排第一」成了承重的排版决定，而封面
# 无处可放。一本书没有这个问题：根就是这本书，`INDEX.md` 就是它的封面。
#
# ★★**分篇的判据**：一块内容答的是**另一个问题**、篇幅又与其余部分相当，它就该是
# 一篇，而不是某一篇目录里的第三级。
#
# ★**一本书只有一个目录源**（本文件）。`guide/public.yml` 是另一件事——它点名「哪几篇随浏览器演示公开发布」，由
# `tools/build-guide.sh` / `tools/make-guide-pages.mjs` 读，与本文件的 toc 互不替代
# （两者一旦合成一条规则，往 guide/ 加一篇仓内章节就会静默地把它发布出去）。
#
# ★**不入册**的目录，逐条说明为什么不入：
#   figures/    图，由章节引用，不是章节。
#   _build/     产物。
#
# 构建：cd docs && myst build --html   （预览：myst start；把警告当错误：--strict）
# 门禁：python/tests/test_docs_books.py
version: 1
project:
  id: fylite-docs
  title: fylite 文档 (Documentation)
  subtitle: 用法 · 参考 · 设计
  authors:
    - name: FuYun / fylite maintainers
  license:
    content: CC-BY-4.0
  numbering:
    headings: true
  #: ★★本书**不带书级题录与数学宏**：指南与算例引的是命令与文件，参考篇与校验册
  #: 引的是**记录**（按路径 + sha256），没有一篇要引文献。要加书级题录须先有一篇
  #: 需要它的章。宏同理。
  toc:
    - file: INDEX.md

    - title: 用户指南 (Guide) —— 怎么用，结果怎么读
      #: ★★**不分小标题**：这十四页是**一条读下去的线**：装 → 跑 → 三个宿主各怎么用
      #: → 结果怎么读 → 逐个主题。一条线不需要小标题分段，分了反而要读者先选组再选章。
      #:
      #: ★排序按**读者要什么**，不按「随不随演示发布」。后者是另一件事，由
      #: `guide/public.yml` 单独点名——两者一旦合成一条规则，往 guide/ 加一篇仓内
      #: 章节就会静默地把它发布出去。
      children:
        - file: guide/index.md
        - file: guide/install.md
        - file: guide/quickstart.md
        - file: guide/cli.md
        - file: guide/python.md
        - file: guide/browser.md
        - file: guide/browser-app.md
        - file: guide/reading-results.md
        - file: guide/limits.md
        - file: guide/input-modes.md
        - file: guide/constraints.md
        - file: guide/forward-and-evolution.md
        - file: guide/reconstruction.md
        - file: guide/stability-and-control.md

    - title: 典型算例 (Worked Examples) —— 一族一章，逐条可跑
      #: ★★**单独成篇**，不寄在指南下（自成一篇的东西不该寄在别人下面）：
      #: 五族算例加一页语料目录，每章的命令与数字都是在本仓实测的，答的是「照抄一条
      #: 完整路径」而不是「怎么用」。文件名不带 `example-` 前缀——目录名已经说了。
      children:
        #: ★一个例子一个目录：散文与它走的 scenario 文件同住
        #: （`examples/<章>/<章>.md` + `examples/<章>/<算例>.jsonld`）。页名 = 目录名，
        #: 不用 `index.md`——站点 URL 随文件名，都叫 index 会挤成 `examples/index-1..5`。
        - file: examples/index.md
        - file: examples/zerod/zerod.md
        - file: examples/transport/transport.md
        - file: examples/evolve/evolve.md
        - file: examples/design/design.md
        - file: examples/reconstruction/reconstruction.md
        - file: examples/device/device.md
        #: ★本书第一册**笔记本**。它与上一章同一个目录：那一章讲的是**一台**机器
        #: （EAST，补全 + 交付），这一册横过来看**六台**——同一条 `fy data convert`
        #: 逐台跑一遍，读回来画成极向截面。判据不同，所以是两页而不是一页的两节。
        - file: examples/device/machine_survey.ipynb

    - title: 参考 (Reference) —— 一个数能不能用，凭什么
      children:
        - file: reference/fidelity.md
        - file: reference/kernels.md
        - file: reference/api.md
        #: ★命令行自成一章，不是 `api.md` 的一节：它是另一个面（十四条命令、三个宿主
        #: 共用一份定义），而 `api.md` 答的是「Python 里从哪进去」。数据层又与命令行
        #: 分开单成一页——七条子命令、两种布局、四类数据源，一节装不下。
        - file: reference/cli.md
        - file: reference/data-layer.md
        - file: reference/scenario.md
        - title: 判据与报告 (Criteria & Reports)
          children:
            - file: reference/benchmark.md
            - file: reference/report-template.md
            - file: reference/case-report.md

    - title: 校验册 (V&V) —— 量过什么，量到多少
      #: ★★三本子册各答一问：**登记册**对外部答案，
      #: **物理校验册**对定律与文档自身的定义，**定序册**说先后与阻塞。
      #: ★逐案 `.jsonld` 与 `registry.jsonld` **不入 toc**：它们是机器读的记录，
      #: 按路径被门禁引用；入册的是给人读的那一半。
      children:
        - file: benchmark/README.md
        - title: 对拍报告 (Comparison reports)
          children:
            - file: benchmark/reports/README.md
            #: ★模板也入册：它是写下一条记录的人要照抄的那一页。
            - file: benchmark/reports/TEMPLATE.md
            - file: benchmark/reports/B-01-fuse-iter.md
            - file: benchmark/reports/B-02-jintrac-iter-102530.md
            - file: benchmark/reports/B-03-jintrac-jet-101612.md
            - file: benchmark/reports/B-04-metis-zerod-geometry.md
            - file: benchmark/reports/B-05-torax-evolution.md
            - file: benchmark/reports/B-06-east-reconstruction.md
            - file: benchmark/reports/B-07-tgyro-converged.md
            - file: benchmark/reports/B-08-fuse-iter-time.md
            - file: benchmark/reports/B-09-dina-ramp.md
            - file: benchmark/reports/B-10-chease-fixed-boundary.md
            - file: benchmark/reports/B-11-east-efit-east-reconstruction.md
            - file: benchmark/reports/B-12-east-raw-trees-kefit.md
            - file: benchmark/reports/B-14-forward-kefit.md
            - file: benchmark/reports/B-15-twin-kefit.md
            - file: benchmark/reports/B-16-fixed-boundary-chease.md
            - file: benchmark/reports/C-01-iter-15ma-astra.md
            - file: benchmark/reports/C-02-alpha-heating-astra.md
            - file: benchmark/reports/C-03-toksys-rzrig.md
            - file: benchmark/reports/C-04-metis-hcd.md
            - file: benchmark/reports/C-05-gyro-momentum-waltz2007.md
            - file: benchmark/reports/C-06-teq-iter-equilibria.md
            - file: benchmark/reports/C-07-tosca-run-space.md
            - file: benchmark/reports/C-09-itpa-tc33.md
            - file: benchmark/reports/C-10-transmak-initiation.md
            - file: benchmark/reports/C-11-qualikiz-ground-truth.md
            - file: benchmark/reports/V-01-gacode-ports.md
            - file: benchmark/reports/V-02-nn-surrogates.md
            - file: benchmark/reports/V-03-qlknn-7-11.md
            - file: benchmark/reports/V-04-gacode-regression-suite.md
            - file: benchmark/reports/V-05-momentum-parity.md
            - file: benchmark/reports/V-06-tgyro-mapping-treg01.md
            - file: benchmark/reports/V-07-tgyro-cases.md
            - file: benchmark/reports/V-08-torax.md
            - file: benchmark/reports/V-09-mavrin-noncoronal.md
            - file: benchmark/reports/V-10-lengyel-closed-forms.md
            - file: benchmark/reports/V-11-lengyel-two-point.md
            - file: benchmark/reports/V-12-lengyel-inverse.md
            - file: benchmark/reports/V-13-lengyel-forward.md
            - file: benchmark/reports/V-14-torax-evolution-composition.md
            - file: benchmark/reports/V-15-gfile-roundtrip.md
            - file: benchmark/reports/V-16-gs-residual-reading.md
