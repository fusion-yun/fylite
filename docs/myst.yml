# fylite 文档 —— **一本书**（2026-09-02 起）。
#
# ★★**为什么从「书集」改回一本。** 分仓那阵这里是 `site.projects` 挂三本独立的书
# （guide / reference / design），每本自带 `myst.yml`。那个形制有一处躲不开的代价：
# MyST 1.10.1 在多 project 站点下**不构建根 project**，于是站点根上没有页面，`/`
# 只能 302 到列表里的第一本——「哪本排第一」成了承重的排版决定，而封面无处可放。
# 一本书没有这个问题：根就是这本书，`INDEX.md` 就是它的封面，三个原来的「书」变成
# 三个部分，各自的 toc 原样并进来。
#
# ★★今天是**五篇**：那三部分里长到自成一篇的两块先后被提出来——`physics/`
# （2026-09-02，从 `reference/`）与 `examples/`（2026-09-03，从 `guide/`）。判据是同一条：
# 一块内容答的是**另一个问题**、篇幅又与母篇其余部分相当，它就该是一篇，而不是母篇
# 目录里的第三级。
#
# ★于是**三份子 `myst.yml` 已删**：一本书只有一个目录源。仍在各目录里的
# `guide/public.yml` 是另一件事——它点名「哪几篇随浏览器演示公开发布」，由
# `tools/build-guide.sh` / `tools/make-guide-pages.mjs` 读，与本文件的 toc 互不替代
# （两者一旦合成一条规则，往 guide/ 加一篇仓内章节就会静默地把它发布出去）。
#
# ★三处**不入册**的目录，逐条说明为什么不入：
#   （benchmark/ 已于 2026-09-08 **入册**，见下。它此前不入册的理由是「按路径引用的
#     记录不需要 URL」——★★那条理由没有错，**但它只覆盖了机器那一半**：`registry.jsonld`
#     与逐案 `.jsonld` 确实按路径被门禁与语料引用，而**散文那一半是给人读的**，
#     人要的恰恰是 URL 与目录。两半并存：路径照旧有效（没有任何文件移位），
#     同时这些页现在有站点位置。用户裁定 2026-09-08。）
#   figures/    图，由章节引用，不是章节。
#   _build/     产物。
#
# 构建：cd docs && myst build --html   （预览：myst start；把警告当错误：--strict）
# 门禁：python/tests/test_docs_books.py
version: 1
project:
  id: fylite-docs
  title: fylite 文档 (Documentation)
  subtitle: 用法 · 参考 · 设计
  authors:
    - name: FuYun / fylite maintainers
  license:
    content: CC-BY-4.0
  numbering:
    headings: true
  #: 物理与数值各篇的文献库（178 条，每条带 note 字段记核验状态）。
  #: ★路径随本文件走，并随 `physics/` 一同提上一级：它原先是
  #: `reference/references-physics.bib`，由 `reference/myst.yml` 声明。
  bibliography:
    - physics/references.bib
  #: 物理与数值各章使用的宏（与 SpResearch book/tmt 同一套，便于跨仓对读）。
  math:
    '\vb': '\mathbf{#1}'
    '\pdv': '\frac{\partial #1}{\partial #2}'
    '\dv': '\frac{\mathrm{d} #1}{\mathrm{d} #2}'
    '\dd': '\mathrm{d}'
    '\expval': '\left\langle #1 \right\rangle'
    '\abs': '\left| #1 \right|'
    '\norm': '\left\| #1 \right\|'
  toc:
    - file: INDEX.md

    - title: 用户指南 (Guide) —— 怎么用，结果怎么读
      #: ★★2026-09-03 **拍平**：此前这里是三个小标题（装起来跑起来 / 会算什么怎么给
      #: 输入 / 典型算例）套着十九页。第三组已经离开——它成了单独一篇「典型算例」，
      #: 与 `physics/` 同一个理由（自成一篇的东西不该寄在别人下面）。剩下的十四页
      #: 是**一条读下去的线**：装 → 跑 → 三个宿主各怎么用 → 结果怎么读 → 逐个主题。
      #: 一条线不需要小标题分段，分了反而要读者先选组再选章。
      #:
      #: ★分组曾经按**读者要什么**排，不按「随不随演示发布」排。后者是另一件事，由
      #: `guide/public.yml` 单独点名——两者一旦合成一条规则，往 guide/ 加一篇仓内
      #: 章节就会静默地把它发布出去。这条仍然成立，且与拍平无关。
      children:
        - file: guide/index.md
        - file: guide/install.md
        - file: guide/quickstart.md
        - file: guide/cli.md
        - file: guide/python.md
        - file: guide/browser.md
        - file: guide/browser-app.md
        - file: guide/reading-results.md
        - file: guide/limits.md
        - file: guide/input-modes.md
        - file: guide/constraints.md
        - file: guide/forward-and-evolution.md
        - file: guide/reconstruction.md
        - file: guide/stability-and-control.md

    - title: 典型算例 (Worked Examples) —— 一族一章，逐条可跑
      #: ★★2026-09-03 从 `guide/` 提上来单独成篇（`physics/` 前一天走的同一条路）：
      #: 五族算例加一页语料目录，每章的命令与数字都是在本仓实测的，答的是「照抄一条
      #: 完整路径」而不是「怎么用」。文件名里那六个 `example-` 前缀随之去掉——目录名
      #: 已经说了，`guide/cases.md` 则成了本篇的 `index.md`。
      children:
        #: ★2026-09-04 一个例子一个目录：散文与它走的 scenario 文件同住
        #: （`examples/<章>/<章>.md` + `examples/<章>/<算例>.jsonld`）。页名 = 目录名，
        #: 不用 `index.md`——站点 URL 随文件名，都叫 index 会挤成 `examples/index-1..5`。
        - file: examples/index.md
        - file: examples/zerod/zerod.md
        - file: examples/transport/transport.md
        - file: examples/evolve/evolve.md
        - file: examples/design/design.md
        - file: examples/reconstruction/reconstruction.md
        - file: examples/device/device.md
        #: ★本书第一册**笔记本**。它与上一章同一个目录：那一章讲的是**一台**机器
        #: （EAST，补全 + 交付），这一册横过来看**六台**——同一条 `fy data convert`
        #: 逐台跑一遍，读回来画成极向截面。判据不同，所以是两页而不是一页的两节。
        - file: examples/device/machine_survey.ipynb

    - title: 参考 (Reference) —— 一个数能不能用，凭什么
      children:
        - file: reference/fidelity.md
        - file: reference/kernels.md
        - file: reference/api.md
        #: ★命令行从 `api.md` 的一节提成一章：它是另一个面（十四条命令、三个宿主
        #: 共用一份定义），而 `api.md` 答的是「Python 里从哪进去」。数据层再从命令行
        #: 里单开一页——七条子命令、两种布局、四类数据源，一节装不下。
        - file: reference/cli.md
        - file: reference/data-layer.md
        - title: 判据与报告 (Criteria & Reports)
          children:
            - file: reference/benchmark.md
            - file: reference/report-template.md
            - file: reference/case-report.md

    - title: 物理与数值 (Physics & Numerics) —— 每个模块实际实现的方程、假设、参数域与算法
      #: ★★2026-09-02 从 `reference/` 提上来单独成篇：十五章 4 800 行，是参考篇其余
      #: 部分的三倍，讲的也是另一件事——参考篇答「这个数能不能用」，本篇答「这个数
      #: 背后是哪条方程、出自哪里、验到什么容差」。章标题里那十五个重复的
      #: 「物理与数值 · 」前缀随之去掉：篇名已经说了。
      children:
        - file: physics/00-overview.md
        - file: physics/01-numerics.md
        - file: physics/02-equilibrium.md
        - file: physics/03-reconstruction.md
        - file: physics/04-geometry.md
        - file: physics/05-transport.md
        - file: physics/06-zerod.md
        - file: physics/07-neoclassical.md
        - file: physics/08-turbulence.md
        - file: physics/09-heating.md
        - file: physics/10-sources.md
        - file: physics/11-edge.md
        - file: physics/12-electromagnetics.md
        - file: physics/13-pulse-breakdown.md
        - file: physics/14-diagnostics.md

    - title: 校验册 (V&V) —— 量过什么，量到多少
      #: ★★2026-09-08 用户裁定入册。三本子册各答一问：**登记册**对外部答案，
      #: **物理校验册**对定律与文档自身的定义，**定序册**说先后与阻塞。
      #: ★逐案 `.jsonld` 与 `registry.jsonld` **不入 toc**：它们是机器读的记录，
      #: 按路径被门禁引用；入册的是给人读的那一半。
      children:
        - file: benchmark/README.md
        - title: 对拍报告 (Comparison reports)
          children:
            - file: benchmark/reports/README.md
