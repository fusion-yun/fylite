            - file: benchmark/reports/TEMPLATE.md
            - file: benchmark/reports/B-01-fuse-iter.md
            - file: benchmark/reports/B-02-jintrac-iter-102530.md
            - file: benchmark/reports/B-03-jintrac-jet-101612.md
            - file: benchmark/reports/B-04-metis-zerod-geometry.md
            - file: benchmark/reports/B-05-torax-evolution.md
            - file: benchmark/reports/B-06-east-reconstruction.md
            - file: benchmark/reports/B-07-tgyro-converged.md
