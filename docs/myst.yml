# fylite 文档 —— **一本书**。
#
# ★★**为什么是一本书而不是书集。** 用 `site.projects` 挂几本各自带 `myst.yml` 的书，
# 有一处躲不开的代价：MyST 1.10.1 在多 project 站点下**不构建根 project**，于是站点根上
# 没有页面，`/` 只能 302 到列表里的第一本——「哪本排第一」成了承重的排版决定，而封面
# 无处可放。一本书没有这个问题：根就是这本书，`INDEX.md` 就是它的封面。
#
# ★★**分篇的判据**：一块内容答的是**另一个问题**、篇幅又与其余部分相当，它就该是
# 一篇，而不是某一篇目录里的第三级。
#
# ★**一本书只有一个目录源**（本文件）。`guide/public.yml` 是另一件事——它点名「哪几篇随浏览器演示公开发布」，由
# `tools/build-guide.sh` / `tools/make-guide-pages.mjs` 读，与本文件的 toc 互不替代
# （两者一旦合成一条规则，往 guide/ 加一篇仓内章节就会静默地把它发布出去）。
#
# ★**不入册**的目录，逐条说明为什么不入：
#   figures/    图，由章节引用，不是章节。
#   _build/     产物。
#
# 构建：cd docs && myst build --html   （预览：myst start；把警告当错误：--strict）
# 门禁：python/tests/test_docs_books.py
version: 1
project:
  id: fylite-docs
  title: fylite 文档 (Documentation)
  subtitle: 用法 · 参考 · 设计
  authors:
    - name: FuYun / fylite maintainers
  license:
    content: CC-BY-4.0
  numbering:
    headings: true
  #: ★★本书**不带书级题录与数学宏**：指南与算例引的是命令与文件，参考篇与校验册
  #: 引的是**记录**（按路径 + sha256），没有一篇要引文献。要加书级题录须先有一篇
  #: 需要它的章。宏同理。
  toc:
    - file: INDEX.md

    - title: 用户指南 (Guide) —— 怎么用，结果怎么读
      #: ★★**不分小标题**：这十四页是**一条读下去的线**：装 → 跑 → 三个宿主各怎么用
      #: → 结果怎么读 → 逐个主题。一条线不需要小标题分段，分了反而要读者先选组再选章。
      #:
      #: ★排序按**读者要什么**，不按「随不随演示发布」。后者是另一件事，由
      #: `guide/public.yml` 单独点名——两者一旦合成一条规则，往 guide/ 加一篇仓内
      #: 章节就会静默地把它发布出去。
      children:
        - file: guide/index.md
        - file: guide/install.md
        - file: guide/quickstart.md
        - file: guide/cli.md
        - file: guide/python.md
        - file: guide/browser.md
        - file: guide/browser-app.md
        - file: guide/reading-results.md
        - file: guide/limits.md
        - file: guide/input-modes.md
        - file: guide/constraints.md
        - file: guide/forward-and-evolution.md
        - file: guide/reconstruction.md
        - file: guide/stability-and-control.md

    - title: 典型算例 (Worked Examples) —— 一族一章，逐条可跑
      #: ★★**单独成篇**，不寄在指南下（自成一篇的东西不该寄在别人下面）：
      #: 五族算例加一页语料目录，每章的命令与数字都是在本仓实测的，答的是「照抄一条
      #: 完整路径」而不是「怎么用」。文件名不带 `example-` 前缀——目录名已经说了。
      children:
        #: ★一个例子一个目录：散文与它走的 scenario 文件同住
        #: （`examples/<章>/<章>.md` + `examples/<章>/<算例>.jsonld`）。页名 = 目录名，
        #: 不用 `index.md`——站点 URL 随文件名，都叫 index 会挤成 `examples/index-1..5`。
        - file: examples/index.md
        - file: examples/zerod/zerod.md
        - file: examples/transport/transport.md
        - file: examples/evolve/evolve.md
        - file: examples/design/design.md
        - file: examples/reconstruction/reconstruction.md
        - file: examples/device/device.md
        #: ★本书第一册**笔记本**。它与上一章同一个目录：那一章讲的是**一台**机器
        #: （EAST，补全 + 交付），这一册横过来看**六台**——同一条 `fy data convert`
        #: 逐台跑一遍，读回来画成极向截面。判据不同，所以是两页而不是一页的两节。
        - file: examples/device/machine_survey.ipynb

    - title: 参考 (Reference) —— 一个数能不能用，凭什么
      children:
        - file: reference/fidelity.md
        - file: reference/kernels.md
        - file: reference/api.md
        #: ★命令行自成一章，不是 `api.md` 的一节：它是另一个面（十四条命令、三个宿主
        #: 共用一份定义），而 `api.md` 答的是「Python 里从哪进去」。数据层又与命令行
        #: 分开单成一页——七条子命令、两种布局、四类数据源，一节装不下。
        - file: reference/cli.md
        - file: reference/data-layer.md
        - file: reference/scenario.md
        - title: 判据与报告 (Criteria & Reports)
          children:
            - file: reference/benchmark.md
            - file: reference/report-template.md
            - file: reference/case-report.md


    - title: 校验册 (V&V) —— 对着外部答案量到多少
      #: ★★2026-09-16 重起（用户裁定）。上一本在 `docs/benchmark-legacy/`：已移出版本控制、
      #: 不入 toc、仅供查阅。
      #:
      #: ★★**本册按物理专题组织，二级分组**：一级三组（平衡 · MHD 稳定性 · 输运），
      #: 二级十六章，每章一页散文。需求号**不是轴**——上游两份 SRS 都标 `distribution:
      #: internal`，本册的读者打不开它们，于是「本条覆盖 FR-EQ-016」对他们只是一个不可解
      #: 的记号。判据因此是**抄录**进来的（`transcript.jsonld`，带源的 sha256），需求号降为
      #: 每条记录的 `requirement[]` 字段。
      #:
      #: ★一级分组不等于 SRS 组件：MHD 稳定性在 SRS-03 里属 fyeq，这里单列一组——它是
      #: 三十七条 EQ 需求里的十八条，篇幅与另两组相当，而它问的是另一个问题。
      #:
      #: ★逐条记录 `records/*.jsonld`、`domains.jsonld`、`requirements.jsonld`、
      #: `transcript.jsonld`、`index.jsonld`、`kernel.json` **不入 toc**：它们是机器读的
      #: 那一半，按路径被门禁引用；入册的是给人读的那一半。
      children:
        - file: benchmark/README.md
        #: ★★两张生成件**各答一个问题，不是同一张表的两种排版**：
        #:   coverage.md 答「够不够」——需求 × 记录，没有记录的需求显示为空行，空行即缺口；
        #:   status.md   答「这些记录还作不作数」——版本 / 评审 / 内核 / 新鲜度，CI 读它。
        #: 两者都由 `tools/benchmark-book.py` 写。
        #: ★★2026-09-16 用户裁定「records 逐条配以测试报告且收入 myst」：
        #: `reports/<ID>.md` 一条记录一份，**由记录生成**（`tools/benchmark-book.py`），
        #: 挂在它所属的域章下面。手写会漂——改一条记录的 finding 而忘了改它的报告，
        #: 读者就会在同一件事上读到两个数。★漏挂 toc 由 test_benchmark_register.py 抓。
        - file: benchmark/coverage.md
        - file: benchmark/status.md

        #: ★★2026-09-16 用户裁定「benchmark 开目录收敛说明散文」。
        #: 它是**一轮工作的快照**，不是长期正本——记录才是正本，且记录带着自己的变更史。
        #: 所以这里按轮次一页，下一轮补一页，**不改写上一页**。
        - title: 收敛说明 (Rounds) —— 一轮做了什么、收敛到什么
          children:
            - file: benchmark/summary/2026-09-16-equilibrium.md

        - title: 平衡 (Equilibrium) —— 磁面在哪里，算得准不准
          children:
            - file: benchmark/domains/eq/forward.md
            - file: benchmark/domains/eq/surface.md
            - file: benchmark/domains/eq/evolve.md
            - file: benchmark/domains/eq/inverse.md
            - file: benchmark/domains/eq/reconstruct.md
            - file: benchmark/domains/eq/convention.md

        - title: MHD 稳定性 (Stability) —— 这个位形稳不稳
          children:
            - file: benchmark/domains/mhd/vertical.md
            - file: benchmark/domains/mhd/analytic.md
            - file: benchmark/domains/mhd/energy.md
            - file: benchmark/domains/mhd/deltaw.md

        - title: 输运 (Transport) —— 剖面怎么演化，闭包对不对
          children:
            - file: benchmark/domains/tr/equations.md
            - file: benchmark/domains/tr/closure.md
            - file: benchmark/domains/tr/paradigm.md
            - file: benchmark/domains/tr/pedestal.md
            - file: benchmark/domains/tr/coupling.md
            - file: benchmark/domains/tr/conservation.md


        #: ★★2026-09-16 用户裁定「报告挂在校验册下」：逐条报告从**各章的子节点**提到
        #: 篇下的一个**平级分组**。原先挂在第四层（篇 → 组 → 域章 → 报告），侧边栏默认收起，
        #: 读者看不见。★代价照实记：报告与它所属的域，在 toc 上不再有父子关系——
        #: 这层关系改由**正文**承担（各章的「本域的记录」表逐条链过去，由
        #: `test_the_prose_actually_points_at_the_reports` 守着）。
        #: ★组内按**域树**排序，不按字母：平衡六域 → MHD 四域 → 输运六域，与书的轴一致。
        - title: 逐条报告 (Reports) —— 一条记录一份，固定六节
          children:
            - file: benchmark/reports/eq-forward-boundary-rule-vs-kefit.md
            - file: benchmark/reports/eq-forward-chease-solovev.md
            - file: benchmark/reports/eq-forward-kefit-east137985.md
            - file: benchmark/reports/eq-forward-solovev-fixed-boundary.md
            - file: benchmark/reports/eq-forward-green-response-shared.md
            - file: benchmark/reports/eq-forward-self-contained-core.md
            - file: benchmark/reports/eq-surface-chease-fixed-boundary-east.md
            - file: benchmark/reports/eq-evolve-analytic-circuit-limits.md
            - file: benchmark/reports/mhd-vertical-freegsnke-east137985.md
            - file: benchmark/reports/mhd-vertical-coil-forces-analytic.md
            - file: benchmark/reports/eq-inverse-freegsnke-east137985.md
            - file: benchmark/reports/eq-inverse-iter-reference-separatrix.md
            - file: benchmark/reports/eq-reconstruct-kefit-twin.md
            - file: benchmark/reports/eq-reconstruct-twin-truth-recovery.md
            - file: benchmark/reports/eq-reconstruct-twin-observable-space.md
            - file: benchmark/reports/eq-reconstruct-fast-ion-pressure.md
            - file: benchmark/reports/eq-reconstruct-kinetic-outer.md
            - file: benchmark/reports/eq-reconstruct-curvature-prior.md
            - file: benchmark/reports/eq-convention-gfile-cocos-roundtrip.md
            - file: benchmark/reports/eq-convention-ladder-flux-gauge.md
            - file: benchmark/reports/tr-closure-15d-source-switches.md
            - file: benchmark/reports/tr-closure-dt-burn-astra.md
            - file: benchmark/reports/tr-paradigm-pereverzev.md
            - file: benchmark/reports/tr-paradigm-flux-match-vs-pde.md
            - file: benchmark/reports/tr-paradigm-coupled-block-adr.md
            - file: benchmark/reports/tr-equations-boundary-family.md
            - file: benchmark/reports/tr-equations-channel-descriptor.md
            - file: benchmark/reports/tr-pedestal-sawtooth-kadomtsev.md
            - file: benchmark/reports/tr-coupling-nn-weights-external.md
            - file: benchmark/reports/tr-conservation-fyo-dd-contract.md
            - file: benchmark/reports/tr-conservation-time-order.md
            - file: benchmark/reports/tr-closure-plugin-dispatch.md
            - file: benchmark/reports/tr-closure-lazy-plugin-resolution.md
            - file: benchmark/reports/tr-coupling-equilibrium-outer-loop.md
            - file: benchmark/reports/tr-pedestal-zerod-bookkeeping-metis.md

    - file: ACKNOWLEDGEMENTS.md
site:
