    - title: 设计集 (Design) —— 它为什么长这样
      #: ★路径权威是 `design/INDEX.md`（文档以 `document_id` 指认，经那张表解析路径）；
      #: 文档集增删或改版时，本 toc 与那张表在同一变更中更新。
      children:
        - file: design/INDEX.md
        - title: 规格链 (Specifications)
          children:
            - file: design/FYL-CONOPS-00.md
            - file: design/FYL-SRS-01.md
            - file: design/FYL-SDD-01.md
