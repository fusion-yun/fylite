<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="动理学平衡重构：物理算法流程图">
<title>动理学平衡重构 — 物理算法流程（阶段 0..4，四层判据，一条回边）</title>
<style>
:root { --bg:#f4f5f7; --panel:#ffffff; --fg:#1c2128; --muted:#666f7a; --grid:#d8dce2;
  --accent:#1668c8; --lcfs:#d0342c; --alt:#10897a; --warn:#a75909; --sel:#e7f0fb; --wall:#5a6270; }
text { font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif; font-size:13px; fill:var(--fg); }
.h { font-size:16px; font-weight:600; }
.s { font-size:11.5px; fill:var(--muted); }
.k { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; fill:var(--accent); }
.node { fill:var(--panel); stroke:var(--grid); stroke-width:1.2; }
.node-code { fill:var(--panel); stroke:var(--accent); stroke-width:1.4; }
.node-off { fill:var(--panel); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:5 4; }
.doc { fill:var(--sel); stroke:var(--accent); stroke-width:1; }
.crit { fill:#fff7ed; stroke:var(--warn); stroke-width:1; }
.edge { fill:none; stroke:var(--wall); stroke-width:1.6; marker-end:url(#a); }
.edge-model { fill:none; stroke:var(--wall); stroke-width:1.6; stroke-dasharray:6 4; marker-end:url(#a); }
.back { fill:none; stroke:var(--lcfs); stroke-width:2; marker-end:url(#ab); }
.gate { fill:none; stroke:var(--warn); stroke-width:1.4; marker-end:url(#aw); }
.tag { font-size:10.5px; fill:var(--warn); }
.off-t { fill:var(--muted); }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6270"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d0342c"/></marker>
  <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a75909"/></marker>
</defs>
<rect width="1240" height="720" fill="#f4f5f7"/>
<text x="24" y="34" class="h">动理学平衡重构 · 物理算法流程</text>
<text x="24" y="54" class="s">实线边 = 数据约束（来自测量文档）· 虚线边 = 模型约束（来自公式或给定形状）· 红边 = 外环回边 · 虚框节点 = 今天无 code（关着的节点）</text>

<!-- inputs -->
<rect x="24" y="110" width="170" height="58" rx="6" class="doc"/>
<text x="36" y="132">装置文档</text><text x="36" y="150" class="k">fyo:DeviceDescription</text>
<rect x="24" y="190" width="170" height="58" rx="6" class="doc"/>
<text x="36" y="212">磁测量文档</text><text x="36" y="230" class="k">magnetics · pf_active · tf</text>
<rect x="24" y="330" width="170" height="74" rx="6" class="doc"/>
<text x="36" y="352">剖面诊断</text><text x="36" y="370" class="k">thomson_scattering</text><text x="36" y="388" class="s">(cer · ece · mse：缺卷宗)</text>

<!-- stage 0 -->
<rect x="250" y="130" width="230" height="98" rx="6" class="node-code"/>
<text x="262" y="152" class="h" style="font-size:14px">阶段 0 · 基准平衡</text>
<text x="262" y="172" class="k">code/reconstruction</text>
<text x="262" y="190" class="k">switches: only_magnetic</text>
<text x="262" y="210" class="s">产 ψ(R,Z) · 边界 · q · l_i(3)</text>
<rect x="250" y="240" width="230" height="30" rx="4" class="crit"/>
<text x="262" y="260" class="tag">内层判据：GS 残差 &lt; ε（Picard）</text>

<!-- stage 1 -->
<rect x="530" y="130" width="230" height="118" rx="6" class="node-code"/>
<text x="542" y="152" class="h" style="font-size:14px">阶段 1 · 剖面构造</text>
<text x="542" y="172" class="k">code/ladder → 映射到 ψ_N</text>
<text x="542" y="190" class="k">code/profile_fit（GCV 定阶）</text>
<text x="542" y="208" class="s">产 pressure 文档（含出处）</text>
<text x="542" y="228" class="s">时间窗均值（est2）</text>
<rect x="530" y="262" width="110" height="44" rx="6" class="node-off"/>
<text x="540" y="280" class="off-t">ELM 相位</text><text x="540" y="296" class="off-t">条件平均</text>
<rect x="650" y="262" width="110" height="44" rx="6" class="node-off"/>
<text x="660" y="280" class="off-t">Tₑ,sep 对齐</text><text x="660" y="296" class="off-t">（双点模型）</text>

<!-- stage 2 -->
<rect x="810" y="130" width="230" height="118" rx="6" class="node-code"/>
<text x="822" y="152" class="h" style="font-size:14px">阶段 2 · 约束构造</text>
<text x="822" y="172" class="s">p = nₑTₑ + Σnᵢ Tᵢ + p_fast</text>
<text x="822" y="190" class="k">pfast · pfastpk · tite · zeff</text>
<text x="822" y="208" class="s">j∥ = j_bs（Redl-2021）+ …</text>
<text x="822" y="228" class="k">code/bootstrap</text>
<rect x="810" y="262" width="230" height="44" rx="6" class="node-off"/>
<text x="822" y="280" class="off-t">MSE 的 Er 修正 · j_NBI · j_ECCD 作约束行</text><text x="822" y="296" class="off-t">（无 MSE 行；beam / rf_ray 是产物不是行）</text>

<!-- stage 3 -->
<rect x="530" y="420" width="230" height="98" rx="6" class="node-code"/>
<text x="542" y="442" class="h" style="font-size:14px">阶段 3 · 动理学反演</text>
<text x="542" y="462" class="k">code/reconstruction</text>
<text x="542" y="480" class="k">switches: kinetic（kin · neon · pointfit）</text>
<text x="542" y="500" class="s">P′ 固定 · FF′ 自由（列均衡 + 截断谱）</text>
<rect x="530" y="530" width="230" height="46" rx="4" class="crit"/>
<text x="542" y="548" class="tag">反演层判据：χ² 饱和（总 · 分诊断）</text>
<text x="542" y="566" class="tag">内层判据：GS 残差 &lt; ε</text>

<!-- stage 4 -->
<path d="M905,410 L1005,470 L905,530 L805,470 Z" class="node-code"/>
<text x="852" y="462" class="h" style="font-size:14px">阶段 4 · 外环</text>
<text x="838" y="482" class="k">fyo:ScenarioLoop</text>
<text x="826" y="500" class="s">Δq₀ · Δq₉₅ &lt; 阈值 ?</text>

<!-- posterior -->
<rect x="1060" y="400" width="160" height="140" rx="6" class="crit"/>
<text x="1072" y="422" class="h" style="font-size:14px">后验验收</text>
<text x="1072" y="442" class="s">二维：GS 残差 ×</text>
<text x="1072" y="458" class="s">磁 χ²（验收区一块）</text>
<text x="1072" y="480" class="s">一致性检验：</text>
<text x="1072" y="496" class="s">q=1 vs 锯齿半径</text>
<text x="1072" y="512" class="s">β_N · l_i 偏离可解释</text>
<text x="1072" y="528" class="k">fyo:ComparisonRecord</text>

<!-- edges -->
<path d="M194,139 L250,160" class="edge"/>
<path d="M194,219 L250,190" class="edge"/>
<path d="M480,180 L530,180" class="edge"/>
<path d="M194,367 C300,367 420,200 530,200" class="edge"/>
<path d="M760,180 L810,180" class="edge"/>
<path d="M640,306 L640,330" class="edge-model" style="marker-end:none"/>
<path d="M925,248 C925,330 645,340 645,420" class="edge"/>
<path d="M1040,200 C1120,200 1120,330 760,330 C700,330 690,380 690,420" class="edge-model"/>
<path d="M760,470 L805,470" class="edge"/>
<path d="M905,410 C905,360 745,350 645,350 C560,350 545,250 555,248" class="back"/>
<text x="700" y="345" class="tag" style="fill:#d0342c">未收敛：新平衡 → 重映射 → 重算自举 → 回到阶段 1</text>
<path d="M1005,470 L1060,470" class="edge"/>
<text x="1010" y="462" class="s">收敛</text>
<path d="M365,228 C365,600 1000,600 1140,540" class="gate"/>
<text x="600" y="612" class="tag">对照边：阶段 0（磁测量-only）vs 阶段 3 的 β_N · l_i · q₀ 偏离</text>

<!-- legend / levels -->
<rect x="24" y="640" width="1192" height="56" rx="6" class="node"/>
<text x="36" y="662" class="s"><tspan style="font-weight:600;fill:#1c2128">三级用户在图上的层：</tspan> L1 初级 —— 选装置 · 炮号 · 时刻，按「运行」；  L2 中级 —— 点开节点改档位（pfast · tite · zeff · FF′ 基阶 · 权重 · kin/pointfit/neon · 阈值）；  L3 高级 —— 换节点（绑 NEO 的 jpar_dke / NUBEAM 的 p_fast 到端口）、改回边、导出整份计划</text>
<text x="36" y="684" class="s">阈值列只写量过的；DIII-D 的典型量级（GS 10⁻⁴ · 外环 1–2 %）作参照不作本仓阈值（FYL-DESIGN-21 §八 偏置提示）。</text>
</svg>
