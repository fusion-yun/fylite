<line x1="472" y1="221.5" x2="1204" y2="221.5" class="grid"/>
<line x1="472" y1="269.0" x2="1204" y2="269.0" class="grid"/>
<line x1="472" y1="316.5" x2="1204" y2="316.5" class="grid"/>
<polyline class="c1" points="472.0,354.5 559.84,212.0 1072.24,212.0 1182.04,354.5"/>
<polyline class="c2" points="472.0,326.0 559.84,231.0 1072.24,231.0 1182.04,326.0"/>
<polyline class="c3" points="472.0,364.0 559.84,307.0 1072.24,202.5 1182.04,193.0"/>
<text x="472" y="380" class="s">t [s]  ·  蓝 I_p · 绿 κ · 红虚 磁通消耗</text>
