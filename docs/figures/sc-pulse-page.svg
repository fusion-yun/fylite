<text x="236" y="276" class="btn-on-t" style="font-size:10.5px">前馈电压</text>
<text x="28" y="302" class="s">V 上限 [kV]</text>
<line x1="166" y1="298" x2="326" y2="298" class="slider"/>
<circle cx="246.0" cy="298" r="6" class="knob"/>
<text x="336" y="302" class="k">1.5</text>
<text x="28" y="328" class="s">L2：改路点与相位；L3：导出脚本 / 绑外部轨迹</text>
