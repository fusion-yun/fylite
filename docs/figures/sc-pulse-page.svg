<text x="364" y="97" class="">取消</text>
<text x="440" y="97" class="s">播放头选片；解过的片实心，插值片空心（D-8）</text>
<rect x="16" y="124" width="400" height="616" rx="4" class="panel"/>
<rect x="16" y="124" width="400" height="26" rx="4" class="head"/>
<text x="28" y="142" class="t">脉冲脚本（D-1：一份脚本，多个视图）</text>
<text x="28" y="174" class="mono">路点   t [s]   Ip [MA]  κ     δ     解</text>
<text x="28" y="190" class="mono">1      0       0.5      1.3   0.1   ✓</text>
<text x="28" y="206" class="mono">2      30      7.5      1.6   0.3   ✓</text>
