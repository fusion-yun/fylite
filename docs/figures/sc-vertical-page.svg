<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" role="img" aria-label="垂直稳定与位置控制：页面效果图">
<title>垂直稳定与位置控制 — 页面效果图（概念图，数值示意）</title>
<style>
:root { --bg:#f4f5f7; --panel:#ffffff; --fg:#1c2128; --muted:#666f7a; --grid:#d8dce2; --line:#e3e6ea;
  --accent:#1668c8; --lcfs:#d0342c; --alt:#10897a; --warn:#a75909; --sel:#e7f0fb; --head:#eceff3; --wall:#5a6270; --ok:#10897a; }
text { font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif; font-size:12.5px; fill:var(--fg); }
.h { font-size:16px; font-weight:600; } .t { font-size:13.5px; font-weight:600; }
.s { font-size:11px; fill:var(--muted); }
.k { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; fill:var(--accent); }
.tag { font-size:10.5px; fill:var(--warn); } .off-t { font-size:11.5px; fill:var(--muted); }
.mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; fill:var(--muted); }
.node { fill:var(--panel); stroke:var(--grid); stroke-width:1.2; }
.node-code { fill:var(--panel); stroke:var(--accent); stroke-width:1.4; }
.node-off { fill:var(--panel); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:5 4; }
.doc { fill:var(--sel); stroke:var(--accent); stroke-width:1; }
.crit { fill:#fff7ed; stroke:var(--warn); stroke-width:1; }
.loop { fill:var(--panel); stroke:var(--accent); stroke-width:1.4; }
.edge { fill:none; stroke:var(--wall); stroke-width:1.6; marker-end:url(#a); }
.edge-model { fill:none; stroke:var(--wall); stroke-width:1.6; stroke-dasharray:6 4; marker-end:url(#a); }
.back { fill:none; stroke:var(--lcfs); stroke-width:2; marker-end:url(#ab); }
.gate { fill:none; stroke:var(--warn); stroke-width:1.4; marker-end:url(#aw); }
.panel { fill:var(--panel); stroke:var(--grid); stroke-width:1; } .head { fill:var(--head); stroke:var(--grid); stroke-width:1; }
.btn { fill:none; stroke:var(--grid); stroke-width:1; } .btn-on { fill:var(--accent); } .btn-on-t { fill:#fff; font-weight:600; }
.slider { stroke:var(--grid); stroke-width:3; stroke-linecap:round; } .knob { fill:var(--panel); stroke:var(--accent); stroke-width:1.6; }
.axes { fill:none; stroke:var(--grid); } .grid { stroke:var(--grid); stroke-width:.8; }
polyline { fill:none; stroke-linejoin:round; stroke-linecap:round; }
.c1 { stroke:var(--accent); stroke-width:2; } .c2 { stroke:var(--alt); stroke-width:2; } .c3 { stroke:var(--lcfs); stroke-width:1.6; stroke-dasharray:5 3; }
.badge-ok { fill:none; stroke:var(--ok); } .badge-run { fill:none; stroke:var(--accent); } .badge-stale { fill:none; stroke:var(--warn); }
.ok-t { fill:var(--ok); } .warn-t { fill:var(--warn); } .acc-t { fill:var(--accent); }
.warnbox { fill:#fff7ed; stroke:var(--warn); } .zone { fill:var(--alt); opacity:.10; stroke:var(--alt); stroke-dasharray:3 3; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6270"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d0342c"/></marker>
  <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a75909"/></marker>
</defs>
<rect width="1240" height="780" fill="#f4f5f7"/>
<rect x="16" y="16" width="1208" height="44" rx="4" class="head"/>
<text x="28" y="43" class="h">控制仿真 · 垂直稳定与位置控制</text>
<text x="520" y="43" class="s">ITER · 平顶平衡来自 D2</text>
<rect x="900" y="26" width="72" height="24" rx="4" class="btn"/><text x="914" y="43">导入</text>
<rect x="984" y="26" width="72" height="24" rx="4" class="btn"/><text x="998" y="43">导出</text>
<rect x="1068" y="26" width="72" height="24" rx="4" class="btn"/><text x="1082" y="43">报告</text>
<rect x="16" y="72" width="1208" height="40" rx="4" class="panel"/>
<rect x="28" y="80" width="90" height="24" rx="4" class="btn-on"/>
<text x="42" y="97" class="btn-on-t">评估裕度</text>
<rect x="126" y="80" width="90" height="24" rx="4" class="btn"/>
<text x="140" y="97" class="">闭环运行</text>
<rect x="224" y="80" width="62" height="24" rx="4" class="btn"/>
<text x="238" y="97" class="">单步</text>
<rect x="294" y="80" width="62" height="24" rx="4" class="btn"/>
<text x="308" y="97" class="">断点</text>
<rect x="364" y="80" width="62" height="24" rx="4" class="btn"/>
<text x="378" y="97" class="">取消</text>
<text x="454" y="97" class="s">取消落在步界；已跑的步完整可用</text>
<rect x="16" y="124" width="400" height="616" rx="4" class="panel"/>
<rect x="16" y="124" width="400" height="26" rx="4" class="head"/>
<text x="28" y="142" class="t">平衡 · 真空室 · 控制律</text>
<text x="28" y="174" class="s">平衡</text>
<rect x="166" y="162" width="212" height="16" rx="8" class="badge-ok"/>
<text x="173" y="174" class="ok-t" style="font-size:10px">x+run://D2/equilibrium</text>
<text x="28" y="198" class="s">真空室</text>
<rect x="166" y="186" width="176" height="16" rx="8" class="badge-stale"/>
<text x="173" y="198" class="warn-t" style="font-size:10px">pf_passive 缺（A-15）</text>
<text x="28" y="222" class="s">K_p</text>
<line x1="166" y1="218" x2="326" y2="218" class="slider"/>
<circle cx="230.0" cy="218" r="6" class="knob"/>
<text x="336" y="222" class="k">1.2</text>
<text x="28" y="248" class="s">K_d [ms]</text>
<line x1="166" y1="244" x2="326" y2="244" class="slider"/>
<circle cx="246.0" cy="244" r="6" class="knob"/>
<text x="336" y="248" class="k">8</text>
<text x="28" y="274" class="s">观测噪声</text>
<line x1="166" y1="270" x2="326" y2="270" class="slider"/>
<circle cx="198.0" cy="270" r="6" class="knob"/>
<text x="336" y="274" class="k">0.5 mm</text>
<text x="28" y="300" class="s">控制律</text>
<rect x="166" y="287" width="36" height="18" rx="9" class="btn-on"/>
<text x="176" y="300" class="btn-on-t" style="font-size:10.5px">PD</text>
<rect x="210" y="287" width="44" height="18" rx="9" class="btn"/>
<text x="220" y="300" class="" style="font-size:10.5px">观测器</text>
<text x="28" y="326" class="s">dt [ms]</text>
<line x1="166" y1="322" x2="326" y2="322" class="slider"/>
<circle cx="214.0" cy="322" r="6" class="knob"/>
<text x="336" y="326" class="k">0.5</text>
<text x="28" y="352" class="s">L2 改增益；L3 绑自己的控制律（外部产物：增益表）</text>
<rect x="432" y="124" width="792" height="300" rx="4" class="panel"/>
<rect x="432" y="124" width="792" height="26" rx="4" class="head"/>
<text x="444" y="142" class="t">裕度 · k / k_ideal · γ（读数来自记录）</text>
<text x="444" y="174" class="mono">量           值        判据</text>
<text x="444" y="190" class="mono">k            0.62      —</text>
<text x="444" y="206" class="mono">k_ideal      0.71      —</text>
<text x="444" y="222" class="mono">k / k_ideal  0.87      &lt; 1 稳定（裕度 13 %）</text>
<text x="444" y="238" class="mono">γ [1/s]      120       γ τ_wall = 2.4</text>
<text x="444" y="260" class="s">判定</text>
<rect x="582" y="248" width="68" height="16" rx="8" class="badge-ok"/>
<text x="589" y="260" class="ok-t" style="font-size:10px">stable</text>
<rect x="432" y="440" width="792" height="300" rx="4" class="panel"/>
<rect x="432" y="440" width="792" height="26" rx="4" class="head"/>
<text x="444" y="458" class="t">闭环 · Z(t) 与线圈电压（示意）</text>
<rect x="472" y="490" width="732" height="150" class="axes"/>
<line x1="472" y1="527.5" x2="1204" y2="527.5" class="grid"/>
<line x1="472" y1="565.0" x2="1204" y2="565.0" class="grid"/>
<line x1="472" y1="602.5" x2="1204" y2="602.5" class="grid"/>
<polyline class="c1" points="472.0,565.0 545.2,505.0 691.6,587.5 838.0,553.0 984.4,568.0 1167.4,565.0"/>
<polyline class="c2" points="472.0,565.0 545.2,625.0 691.6,527.5 838.0,580.0 984.4,557.5 1167.4,565.0"/>
<polyline class="c3" points="472.0,497.5 1167.4,497.5"/>
<text x="472" y="656" class="s">t [ms]  ·  蓝 Z 位移 · 绿 V_VS · 红虚 电压上限</text>
<text x="444" y="674" class="s">失控的一步标红并停在步界（P-8：失败不得留着上一次的答案）</text>
<text x="24" y="766" class="s">★概念图。今天页面无此栏、命令行无模板；Python 有 control.vstab（S9-FR-EVO-1 ◐）。图是目标态。</text>
</svg>
