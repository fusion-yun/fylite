<text x="26.0" y="46.0" class="lbl" font-size="18" text-anchor="start" font-weight="700">放电设计页的视觉词汇</text>
<text x="26.0" y="74.0" class="mut" font-size="13" text-anchor="start">左列是这一页把它画成什么样，中列是它除颜色之外还带的那个通道。中列不是可选项：</text>
