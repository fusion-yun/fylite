<text x="800.0" y="888.0" class="foot" font-size="11" text-anchor="middle">概念图：FYL-DESIGN-09 的状态编码。左列是页面上的样子，中列是它在灰度下仍然读得出来的理由。生成物 —— tools/make-desktop-preview.py</text>
