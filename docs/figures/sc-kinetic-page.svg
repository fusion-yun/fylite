<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-label="动理学平衡重构页面效果图：流程图 · 节点卡 · 控制条 · 外环面板">
<title>动理学平衡重构 — 页面效果图（概念图，数值仅示意）</title>
<style>
:root { --bg:#f4f5f7; --panel:#ffffff; --fg:#1c2128; --muted:#666f7a; --grid:#d8dce2; --line:#e3e6ea;
  --accent:#1668c8; --lcfs:#d0342c; --alt:#10897a; --warn:#a75909; --sel:#e7f0fb; --head:#eceff3; --ok:#10897a; --bad:#c0392b; --wall:#5a6270; }
text { font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif; font-size:12.5px; fill:var(--fg); }
.h { font-size:15px; font-weight:600; } .s { font-size:11px; fill:var(--muted); }
.k { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; fill:var(--accent); }
.panel { fill:var(--panel); stroke:var(--grid); stroke-width:1; }
.head { fill:var(--head); stroke:var(--grid); stroke-width:1; }
.node { fill:var(--panel); stroke:var(--accent); stroke-width:1.4; }
.node-done { fill:var(--panel); stroke:var(--ok); stroke-width:1.6; }
.node-now { fill:var(--sel); stroke:var(--accent); stroke-width:2; }
.node-stale { fill:var(--panel); stroke:var(--warn); stroke-width:1.4; stroke-dasharray:5 3; }
.node-off { fill:var(--panel); stroke:var(--grid); stroke-width:1.2; stroke-dasharray:4 4; }
.node-sel { fill:var(--sel); stroke:var(--accent); stroke-width:2.4; }
.edge { fill:none; stroke:var(--wall); stroke-width:1.5; marker-end:url(#a); }
.edge-model { fill:none; stroke:var(--wall); stroke-width:1.5; stroke-dasharray:6 4; marker-end:url(#a); }
.back { fill:none; stroke:var(--lcfs); stroke-width:1.8; marker-end:url(#ab); }
.btn { fill:none; stroke:var(--grid); stroke-width:1; } .btn-on { fill:var(--accent); } .btn-on-t { fill:#fff; font-weight:600; }
.badge-ok { fill:none; stroke:var(--ok); } .badge-run { fill:none; stroke:var(--accent); } .badge-stale { fill:none; stroke:var(--warn); }
.ok-t { fill:var(--ok); } .warn-t { fill:var(--warn); } .bad-t { fill:var(--bad); } .acc-t { fill:var(--accent); }
.prog-bg { fill:var(--line); } .prog { fill:var(--accent); }
.axes { fill:none; stroke:var(--grid); } .grid { stroke:var(--grid); stroke-width:.8; }
polyline { fill:none; stroke-linejoin:round; stroke-linecap:round; }
.q0 { stroke:var(--accent); stroke-width:2; } .q95 { stroke:var(--alt); stroke-width:2; }
.zone { fill:var(--alt); opacity:.10; stroke:var(--alt); stroke-dasharray:3 3; }
.pt { fill:var(--accent); } .pt-last { fill:var(--lcfs); }
.slider { stroke:var(--grid); stroke-width:3; stroke-linecap:round; } .knob { fill:var(--panel); stroke:var(--accent); stroke-width:1.6; }
.warnbox { fill:#fff7ed; stroke:var(--warn); }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6270"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d0342c"/></marker>
</defs>
<rect width="1240" height="900" fill="#f4f5f7"/>

