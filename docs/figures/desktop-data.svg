.gauge { fill:var(--alt); }
.warnbox { fill:none; stroke:var(--warn); stroke-width:1.4; stroke-dasharray:4 3; }
.warn-t { fill:var(--warn); }
.c-dot { stroke:var(--accent); stroke-width:1.8; stroke-dasharray:1.5 3.5;
