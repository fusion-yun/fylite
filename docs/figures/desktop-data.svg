.lcfs { fill:none; stroke:var(--lcfs); stroke-width:2.2; }
.bar-v { fill:var(--accent); opacity:.55; }
.bar-over { fill:var(--warn); opacity:.72; }
.lim { stroke:var(--wall); stroke-width:1.4; stroke-dasharray:3 2; }
