.bar-rest { fill:var(--grid); opacity:.45; }
.bar-seen { fill:var(--sel); }
.bar-edge { fill:none; stroke:var(--grid); stroke-width:1; }
.brk { fill:none; stroke:var(--bg); stroke-width:6; }
