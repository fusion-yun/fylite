<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="fylite 装置数据页在 16:9 首屏上的概念布局">
<title>fylite 桌面版 — 装置数据页首屏</title>
<style>
:root {
  --bg:#f4f5f7; --panel:#ffffff; --fg:#1c2128; --muted:#666f7a; --grid:#d8dce2;
