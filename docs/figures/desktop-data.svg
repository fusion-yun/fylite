<text x="40.0" y="120.0" class="lbl" font-size="12.5" text-anchor="start">把一台 MDSplus 服务器当成可以走进去的目录：选一棵树、给一个炮号，挑几路信号取回来画出来。</text>
<text x="40.0" y="139.0" class="mut" font-size="12.5" text-anchor="start">它只读 —— 没有入口能写、能删、能求值任意表达式。画出来的是每隔 N 个取一个样点，不是均值。</text>
