<rect x="472" y="490" width="732" height="150" class="axes"/>
<line x1="472" y1="527.5" x2="1204" y2="527.5" class="grid"/>
<line x1="472" y1="565.0" x2="1204" y2="565.0" class="grid"/>
<line x1="472" y1="602.5" x2="1204" y2="602.5" class="grid"/>
<polyline class="c1" points="508.6,497.5 691.6,550.0 874.6,595.0 1057.6,625.0"/>
<polyline class="c2" points="508.6,520.0 691.6,565.0 874.6,598.0 1057.6,622.0"/>
<text x="472" y="656" class="s">轮  ·  蓝 残差(log) · 绿 |通量失配|</text>
<text x="444" y="674" class="s">Picard 6 轮 · 最差残差 8.1e-3 · converged: true（判定在记录）</text>
<text x="24" y="766" class="s">★概念图。数值示意；控件名取自 transport 模板词表（19 参数）与 evolve 的闭包档。</text>
</svg>
