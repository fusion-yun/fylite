<text x="54.0" y="186.0" class="lbl" font-size="12.5" text-anchor="start" font-weight="700">警示</text>
<text x="116.0" y="186.0" class="mut" font-size="12" text-anchor="start">仅限内部测试。保住显著性，交回它占着的 500 px 空白</text>
<circle cx="36.0" cy="208.0" r="8.5" class="badge"/>
<text x="36.0" y="212.0" class="badget" font-size="10.5" text-anchor="middle" font-weight="700">3</text>
<text x="54.0" y="212.0" class="lbl" font-size="12.5" text-anchor="start" font-weight="700">去处</text>
<text x="116.0" y="212.0" class="mut" font-size="12" text-anchor="start">四页图标 · 主题三态 —— 顺序即两张表的顺序，不重排</text>
<circle cx="816.0" cy="156.0" r="8.5" class="badge"/>
