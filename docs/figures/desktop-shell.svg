<text x="834.0" y="160.0" class="lbl" font-size="12.5" text-anchor="start" font-weight="700">★输入</text>
<text x="896.0" y="160.0" class="mut" font-size="12" text-anchor="start">装置（数据页是 mdsip 数据源）· 导入 / 导出</text>
