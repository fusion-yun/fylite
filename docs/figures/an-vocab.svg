}
text { font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,
       -apple-system,'Segoe UI',sans-serif; fill:var(--fg); }
.bg { fill:var(--bg); }
.strip { fill:var(--strip); }
