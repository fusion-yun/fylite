.c5 { stroke:var(--muted); stroke-width:1.4; stroke-dasharray:4 3; }
.zero { stroke:var(--muted); stroke-width:1; }
.lane { stroke:var(--grid); stroke-width:1; stroke-dasharray:2 3; }
