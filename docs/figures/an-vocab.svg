<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="实验分析页的状态编码表：每一种状态的颜色与它的非颜色通道">
<title>fylite 实验分析页 — 视觉词汇</title>
<style>
:root {
  --bg:#f4f5f7; --panel:#ffffff; --fg:#1c2128; --muted:#666f7a; --grid:#d8dce2;
