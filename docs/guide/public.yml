# fylite 用户指南 —— `docs/guide/` 里**面向公开发布**的那个子集。
#
# 这不是一本独立的书：`docs/` 整个是**一本**，目录源只有
# `docs/myst.yml` 一处，`guide/` 是它的一篇。本文件划的是另一件事——**发布面**：
# 哪几篇编译成静态 HTML 落进 `webui/guide/`、随浏览器演示一同公开。仓内其余章节
# （install / quickstart / cli / input-modes / constraints / reconstruction /
# forward-and-evolution / stability-and-control / browser-app）引仓内路径与文档编号，
# 公开页上那些都是断链，所以它们不在这张表里。
#
# ★`cli.md` **不发布**，理由同上：它引 `python/fylite/_cli.json`
# 与设计集编号，且讲的是装好包之后的事——公开页的读者手里没有那个包。
#
# ★为什么是一张表而不是按目录取：目录是**这本书的顺序**，发布面是**另一件事**。
# 两者一旦合成一条规则，往 guide/ 加一篇仓内章节就会静默地把它发布出去。
#
# ★这张表也是侧栏顺序的唯一来源（`tools/make-guide-pages.mjs` 读它，不另抄一份）。
#
# 五族典型算例在 `docs/examples/`，引 `cases/` 仓内路径，同样不在这张表里。
#
# 构建：bash tools/build-guide.sh   （产物 -> webui/guide/，入库，与 app 的其余
# 生成物同一惯例）
version: 1
project:
  id: fylite-user-guide-public
  title: fylite 用户指南
  subtitle: 浏览器与 Python 两种用法，以及结果该怎么读
  authors:
    - name: fylite maintainers
  license:
    content: CC-BY-4.0
  numbering:
    headings: true
  toc:
    - file: index.md
    - file: browser.md
    - file: python.md
    - file: reading-results.md
    - file: limits.md
site:
  template: book-theme
  options:
    #: 站点上本书位于 /fylite/guide/，回演示的链接因此是上一层
    logo_text: fylite 用户指南
  nav:
    - title: 返回演示 (Back to the demo)
      url: ../index.html
