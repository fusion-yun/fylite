<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 212" role="img" aria-label="eq-reconstruct-twin-observable-space: 每条判据离它的带还有多远">
<title>eq-reconstruct-twin-observable-space - 判据余量</title>
<desc>横轴为余量倍数（对数）。1 倍处是判据本身：右侧成立，左侧越界。恒等档没有余量可言，画成标记。</desc>
<text x="8" y="22" font-size="14" font-weight="600" fill="#9a9a9a">判据余量 —— 离带还有多远（对数轴，1 倍即判据本身）</text>
<line x1="380.0" y1="40" x2="380.0" y2="172" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.45"/>
<text x="380.0" y="188" font-size="11" fill="#8a8a8a" text-anchor="middle">10⁻²x</text>
<line x1="476.0" y1="40" x2="476.0" y2="172" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.45"/>
<text x="476.0" y="188" font-size="11" fill="#8a8a8a" text-anchor="middle">10⁻¹x</text>
<line x1="572.0" y1="40" x2="572.0" y2="172" stroke="#8a8a8a" stroke-width="1.4" opacity="0.9"/>
<text x="572.0" y="188" font-size="11" fill="#8a8a8a" text-anchor="middle">1x</text>
<line x1="668.0" y1="40" x2="668.0" y2="172" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.45"/>
<text x="668.0" y="188" font-size="11" fill="#8a8a8a" text-anchor="middle">10¹x</text>
<line x1="764.0" y1="40" x2="764.0" y2="172" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.45"/>
<text x="764.0" y="188" font-size="11" fill="#8a8a8a" text-anchor="middle">10²x</text>
<line x1="860.0" y1="40" x2="860.0" y2="172" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.45"/>
<text x="860.0" y="188" font-size="11" fill="#8a8a8a" text-anchor="middle">10³x</text>
<text x="572.0" y="34" font-size="11" fill="#8a8a8a" text-anchor="middle">judgement</text>
<text x="370" y="72.0" font-size="12" fill="#9a9a9a" text-anchor="end">chi2 / dof（测量为无噪声合成件，应趋于零）</text>
<rect x="572.0" y="61.0" width="120.2" height="14" rx="3" fill="#2e9e4f" opacity="0.85"/>
<text x="698.2" y="72.0" font-size="11" fill="#2e9e4f" text-anchor="start">17.9x</text>
<text x="370" y="100.0" font-size="12" fill="#9a9a9a" text-anchor="end">每通道残差的 RMS（以 sigma 为单位）</text>
<rect x="572.0" y="89.0" width="58.2" height="14" rx="3" fill="#2e9e4f" opacity="0.85"/>
<text x="636.2" y="100.0" font-size="11" fill="#2e9e4f" text-anchor="start">4.03x</text>
<text x="370" y="128.0" font-size="12" fill="#9a9a9a" text-anchor="end">**最劣的那一道**通道的残差（以 sigma 为单位）</text>
<rect x="572.0" y="117.0" width="26.1" height="14" rx="3" fill="#e0a030" opacity="0.85"/>
<text x="604.1" y="128.0" font-size="11" fill="#e0a030" text-anchor="start">1.87x</text>
<text x="370" y="156.0" font-size="12" fill="#9a9a9a" text-anchor="end">这个度量是否**有分辨力**：最优档与次优档的 chi2 …</text>
<rect x="572.0" y="145.0" width="90.6" height="14" rx="3" fill="#2e9e4f" opacity="0.85"/>
<text x="668.6" y="156.0" font-size="11" fill="#2e9e4f" text-anchor="start">8.79x</text>
<text x="8" y="204" font-size="10.5" fill="#8a8a8a">★绿而窄（&lt; 2 倍）另着色：它与余量一千倍的判据在表上长得一样，在这里不一样。　生成：tools/benchmark-figures.py</text>
</svg>
