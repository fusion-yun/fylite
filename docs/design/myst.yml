# 设计集 (The Design Book) —— 一本独立的 MyST 书。
#
# 收录运行概念、软件需求、软件设计描述与逐页设计笔记（`FYL-*` 编号）。
# 路径权威是 `INDEX.md`（`FYL-DESIGN-00` §文档目录）：文档以 `document_id` 指认、
# 经那张表解析路径；文档集增删或改版时，本 `toc:` 与那张表在同一变更中更新。
#
# ★归档不入册：重定位之前的设计笔记冻结在 `../archive/`，不在本书的 toc 里，
# 也不由本书构建——归档是逐篇冻结的历史记录，不是本书的一章。
#
# 构建：cd docs/design && myst build --html   （预览：myst start）
version: 1
project:
  id: fylite-design-book
  title: fylite 设计集 (Design Book)
  subtitle: 运行概念 · 需求 · 设计描述 · 逐页设计笔记
  authors:
    - name: FuYun / fylite maintainers
  license:
    content: CC-BY-4.0
  numbering:
    headings: true
  toc:
    - file: INDEX.md
    - file: FYL-CONOPS-00.md
    - file: FYL-SRS-01.md
    - file: FYL-SDD-01.md
    #: 浏览器前端四页，各一份（`FYL-DESIGN-00` §文档目录是路径权威）
    - file: FYL-DESIGN-09.md
    - file: FYL-DESIGN-10.md
    - file: FYL-DESIGN-12.md
    - file: FYL-DESIGN-13.md
    #: 跨四页共用的那一层：视觉
    - file: FYL-DESIGN-11.md
    #: 数据层：数据源 ↔ fyo
    - file: FYL-DESIGN-14.md
    - file: FYL-DESIGN-15.md
site:
  title: fylite 设计集
  options:
    logo: ../figures/fylite_logo.svg
